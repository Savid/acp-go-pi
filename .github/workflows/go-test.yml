name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Build
        run: go build ./...

      - name: Test and coverage gate
        run: .github/scripts/run-privileged-suite.sh coverage-check

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Check platform compile and refusal paths
        run: make test-cross-compile

      - name: Check module tidiness
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum

      - name: Check modernization drift
        run: make modernize-check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt

  trusted-supervisor:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Trusted supervisor security suite
        run: .github/scripts/run-privileged-suite.sh test-trusted-supervisor

  native-browser:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Native browser containment canary
        run: .github/scripts/with-privileged-lock.sh make test-integration-native-browser

  # Pi is the only sibling whose ordinary launch path resolves an executable
  # from a supplied Windows environment, so it is the only one whose Windows
  # last-wins composition has a behavioral claim to execute. The lane is a
  # GitHub-hosted `windows-latest` runner because no self-hosted Windows host
  # exists; that placement is a deliberate Pi-specific addition to the shared
  # workflow shape and has to be registered as such at family level rather than
  # read as an accidental fork. It carries no family-prefixed environment
  # carrier: the child mode travels in argv, because the environment is the
  # thing under test.
  windows-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Execute supplied-environment PATH resolution
        shell: bash
        run: |
          set -euo pipefail
          selector='^(TestOrdinaryWindowsExecutableResolutionExecutesSuppliedPATHEXTChild|TestWindowsEnvironmentCompositionIsCaseInsensitiveLastWins)$'
          log=$(mktemp)
          expected=$(go test -list "$selector" ./internal/pi | grep -Ec '^Test' || true)
          [ "$expected" -eq 2 ] || { echo "windows executable test count $expected, want 2"; exit 1; }
          go test -count=1 -v -run "$selector" ./internal/pi 2>&1 | tee "$log"
          passed=$(grep -Ec '^--- PASS: Test[^/]+ ' "$log" || true)
          skipped=$(grep -Ec '^[[:space:]]*--- SKIP: Test' "$log" || true)
          [ "$passed" -eq "$expected" ] || { echo "windows executable pass count $passed, want $expected"; exit 1; }
          [ "$skipped" -eq 0 ] || { echo "windows executable lane skipped $skipped tests"; exit 1; }
