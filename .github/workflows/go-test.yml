name: Test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Build
        run: make build

      - name: Test and coverage report
        run: make coverage-check

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Check platform compile and refusal paths
        run: make test-cross-compile

      - name: Check module tidiness
        run: make tidy

      - name: Check modernization drift
        run: make modernize-check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt

  native-browser:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/workflows/go-setup

      - name: Native browser canary
        run: make test-integration-native-browser

  # last-wins composition has a behavioral claim to execute. The lane is a
  # workflow shape and has to be registered as such at family level rather than
  # read as an accidental fork. It carries no family-prefixed environment
  # carrier: the child mode travels in argv, because the environment is the
  # thing under test.
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Execute supplied-environment PATH resolution
        shell: bash
        run: .github/scripts/run-windows-behavior-proof.sh

  macos-runtime:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Execute macOS process and environment behavior
        shell: bash
        run: .github/scripts/run-macos-behavior-proof.sh
